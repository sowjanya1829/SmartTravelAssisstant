
services:
  backend:
    build: .
    command: uvicorn hybrid_retriever:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      QDRANT_PATH: /app/qdrant_storage
    volumes:
      - ./qdrant_storage:/app/qdrant_storage
    ports:
      - "8000:8000"

  frontend:
    build: .
    command: streamlit run streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
